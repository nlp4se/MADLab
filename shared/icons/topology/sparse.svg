<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Sparse topology">
  <title>Sparse topology</title>
  <!-- Few edges: each agent interacts with a limited subset of peers -->
  <line x1="14" y1="16" x2="46" y2="20" />
  <line x1="46" y1="20" x2="22" y2="46" />
  <line x1="50" y1="48" x2="22" y2="46" />
  <circle cx="14" cy="16" r="6" fill="currentColor" fill-opacity="0.15" />
  <circle cx="46" cy="20" r="6" fill="currentColor" fill-opacity="0.15" />
  <circle cx="22" cy="46" r="6" fill="currentColor" fill-opacity="0.15" />
  <circle cx="50" cy="48" r="6" fill="currentColor" fill-opacity="0.15" />
</svg>
