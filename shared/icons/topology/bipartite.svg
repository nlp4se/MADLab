<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Bipartite topology">
  <title>Bipartite topology</title>
  <!-- Two disjoint sets interacting across the partition -->
  <line x1="18" y1="16" x2="46" y2="16" />
  <line x1="18" y1="16" x2="46" y2="32" />
  <line x1="18" y1="16" x2="46" y2="48" />
  <line x1="18" y1="32" x2="46" y2="16" />
  <line x1="18" y1="32" x2="46" y2="32" />
  <line x1="18" y1="32" x2="46" y2="48" />
  <line x1="18" y1="48" x2="46" y2="16" />
  <line x1="18" y1="48" x2="46" y2="32" />
  <line x1="18" y1="48" x2="46" y2="48" />
  <circle cx="18" cy="16" r="5" fill="currentColor" fill-opacity="0.15" />
  <circle cx="18" cy="32" r="5" fill="currentColor" fill-opacity="0.15" />
  <circle cx="18" cy="48" r="5" fill="currentColor" fill-opacity="0.15" />
  <circle cx="46" cy="16" r="5" fill="currentColor" fill-opacity="0.3" />
  <circle cx="46" cy="32" r="5" fill="currentColor" fill-opacity="0.3" />
  <circle cx="46" cy="48" r="5" fill="currentColor" fill-opacity="0.3" />
</svg>
