<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Ring topology">
  <title>Ring topology</title>
  <!-- Cyclic chain: nodes connected in a closed loop -->
  <line x1="32" y1="12" x2="50" y2="22" />
  <line x1="50" y1="22" x2="50" y2="42" />
  <line x1="50" y1="42" x2="32" y2="52" />
  <line x1="32" y1="52" x2="14" y2="42" />
  <line x1="14" y1="42" x2="14" y2="22" />
  <line x1="14" y1="22" x2="32" y2="12" />
  <circle cx="32" cy="12" r="6" fill="currentColor" fill-opacity="0.15" />
  <circle cx="50" cy="22" r="6" fill="currentColor" fill-opacity="0.15" />
  <circle cx="50" cy="42" r="6" fill="currentColor" fill-opacity="0.15" />
  <circle cx="32" cy="52" r="6" fill="currentColor" fill-opacity="0.15" />
  <circle cx="14" cy="42" r="6" fill="currentColor" fill-opacity="0.15" />
  <circle cx="14" cy="22" r="6" fill="currentColor" fill-opacity="0.15" />
</svg>
