<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Layered topology">
  <title>Layered topology</title>
  <!-- Sequential layers, each fully connected to the next -->
  <line x1="20" y1="14" x2="20" y2="32" />
  <line x1="20" y1="14" x2="44" y2="32" />
  <line x1="44" y1="14" x2="20" y2="32" />
  <line x1="44" y1="14" x2="44" y2="32" />
  <line x1="20" y1="32" x2="20" y2="50" />
  <line x1="20" y1="32" x2="44" y2="50" />
  <line x1="44" y1="32" x2="20" y2="50" />
  <line x1="44" y1="32" x2="44" y2="50" />
  <circle cx="20" cy="14" r="5" fill="currentColor" fill-opacity="0.15" />
  <circle cx="44" cy="14" r="5" fill="currentColor" fill-opacity="0.15" />
  <circle cx="20" cy="32" r="5" fill="currentColor" fill-opacity="0.15" />
  <circle cx="44" cy="32" r="5" fill="currentColor" fill-opacity="0.15" />
  <circle cx="20" cy="50" r="5" fill="currentColor" fill-opacity="0.15" />
  <circle cx="44" cy="50" r="5" fill="currentColor" fill-opacity="0.15" />
</svg>
